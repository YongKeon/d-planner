name: Build android apk (cloud, source = Gitee)

# Source of truth lives on Gitee (https://gitee.com/nalansj/d-planner).
# This repo only hosts the CI definition, so every run clones Gitee main first.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-apk-cloud.yml'

concurrency:
  group: build-apk-cloud
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clone source from Gitee
        run: |
          git clone --depth 1 https://gitee.com/nalansj/d-planner.git src
          cd src
          echo "HEAD: $(git log -1 --oneline)"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'src/package-lock.json'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Capacitor dependencies
        working-directory: src
        run: npm ci

      - name: Prepare web assets (www/)
        working-directory: src
        run: python3 tools/sync_www.py

      - name: Capacitor sync (web assets -> android/app/src/main/assets/public)
        working-directory: src
        run: npx cap sync android

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('src/android/**/*.gradle', 'src/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build debug APK
        working-directory: src/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Collect APK
        run: |
          mkdir -p out
          cp src/android/app/build/outputs/apk/debug/app-debug.apk out/D-PLANNER.apk
          ls -lh out

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: D-PLANNER-apk
          path: out/D-PLANNER.apk
          if-no-files-found: error
          retention-days: 30
